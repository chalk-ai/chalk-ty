name: Bug report
description: Report an error or unexpected behavior
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue with chalk-lsp.

        **Before reporting, please search the [existing issues](https://github.com/chalk-ai/chalk-ty/issues).**

  - type: textarea
    attributes:
      label: Summary
      description: |
        A clear and concise description of the bug, including a minimal reproducible example.

        Include the relevant editor, client configuration, Chalk configuration,
        and a minimal project that reproduces the issue when possible.

    validations:
      required: true

  - type: input
    attributes:
      label: Version
      description: What version of chalk-lsp are you using?
    validations:
      required: false
