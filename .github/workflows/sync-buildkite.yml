name: Sync Buildkite Pipelines

on:
  push:
    branches: [main]
    paths:
      - '.buildkite/**'
      - '.github/workflows/sync-buildkite.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chalk-ai/buildkite-sync-action@v1
        with:
          cluster-id: ${{ secrets.BUILDKITE_CLUSTER_ID }}
          team-uuid: ${{ secrets.BUILDKITE_TEAM_UUID }}
          default-branch: main
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
